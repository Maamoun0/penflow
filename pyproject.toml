[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "penflow"
version = "30.0.0"
description = "PenFlow — Autonomous Web Application Security Research & Recon Engine"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ahmed Maamoun", email = "ahmedmaamoun.sec@gmail.com" }
]
dependencies = [
    "httpx[http2]>=0.28.1",
    "aiofiles>=24.1.0",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.4",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "rich>=13.9.4",
    "jinja2>=3.1.5",
    "markdown>=3.7.0",
    "networkx>=3.4.2",
    "cryptography>=44.0.0",
    "tldextract>=5.1.3",
    "openai>=1.58.1",
    "python-dateutil>=2.9.0",
    "beautifulsoup4>=4.12.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "types-pyyaml>=6.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=strict"
testpaths = [
    "tests"
]
pythonpath = [
    "."
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
