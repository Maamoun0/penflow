# ============================================================
# PenFlow — Master Configuration
# ============================================================

project:
  name: "PenFlow"
  version: "1.0.0"
  description: "Offensive Security Orchestration Platform"

# Active profile: stealth | normal | aggressive
active_profile: "normal"

profiles:
  stealth:
    max_concurrency: 3
    requests_per_second: 1
    timeout_seconds: 20
    retry_count: 2
    delay_between_requests_ms: 1000
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    randomize_user_agent: true
    randomize_delay: true

  normal:
    max_concurrency: 10
    requests_per_second: 3
    timeout_seconds: 15
    retry_count: 3
    delay_between_requests_ms: 300
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    randomize_user_agent: false
    randomize_delay: true

  aggressive:
    max_concurrency: 25
    requests_per_second: 10
    timeout_seconds: 10
    retry_count: 2
    delay_between_requests_ms: 50
    user_agent: "PenFlow/1.0"
    randomize_user_agent: false
    randomize_delay: false

# Network Settings
network:
  proxy:
    enabled: false
    url: "http://127.0.0.1:8080"  # Burp Suite default
    verify_ssl: false
  dns_resolver: "8.8.8.8"
  follow_redirects: true
  max_redirects: 5

# Rate Limiter (Adaptive)
rate_limiter:
  algorithm: "token_bucket"
  backoff_on_429: true
  backoff_multiplier: 2.0
  max_backoff_seconds: 60
  recovery_threshold: 5  # Successful requests before speeding up

# Circuit Breaker
circuit_breaker:
  failure_threshold: 5
  recovery_timeout_seconds: 30
  half_open_max_calls: 3

# Cache
cache:
  enabled: true
  directory: "cache"
  ttl_hours: 24
  max_size_mb: 500
  skip_extensions: [".png", ".jpg", ".jpeg", ".gif", ".svg", ".ico", ".woff", ".woff2", ".ttf", ".eot", ".mp4", ".mp3"]

# State Management
state:
  directory: "state"
  auto_checkpoint_interval_seconds: 30
  max_checkpoints: 10

# Logging
logging:
  directory: "logs"
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR | CRITICAL
  max_file_size_mb: 10
  max_files: 5
  json_format: true
  console_output: true

# Scan Output
scans:
  directory: "scans"
  raw_subdir: "raw"
  filtered_subdir: "filtered"
  graph_subdir: "graph"
  report_subdir: "report"

# Recon Settings
recon:
  subdomain:
    sources:
      - "subfinder"
      - "crtsh"
      - "wayback"
    resolve_dns: true
    filter_wildcards: true

  crawler:
    max_depth: 5
    max_pages: 1000
    skip_static: true
    extract_forms: true
    extract_comments: true
    classify_endpoints: true
    skip_extensions: [".css", ".js", ".png", ".jpg", ".gif", ".svg", ".ico", ".woff", ".pdf", ".zip"]
    scope_mode: "strict"  # strict | relaxed | custom

  js_analysis:
    enabled: true
    max_file_size_kb: 2048
    extract_endpoints: true
    extract_params: true
    extract_secrets: true
    extract_graphql: true
    extract_websockets: true

  passive:
    wayback: true
    commoncrawl: false  # Heavy bandwidth
    gau: true

# Knowledge Graph
graph:
  engine: "networkx"
  auto_correlate: true
  save_format: "json"
  prioritization:
    weight_no_auth: 3.0
    weight_admin: 2.5
    weight_api: 2.0
    weight_legacy: 1.8
    weight_upload: 1.5
    weight_debug: 3.0

# Scanner Settings
scanner:
  context_aware: true
  nuclei:
    enabled: true
    templates_path: ""  # Auto-detect
    severity_filter: ["critical", "high", "medium"]
    rate_limit: 5
    selective_mode: true  # Only run relevant templates

  custom_detectors:
    idor_bola:
      enabled: true
      multi_user: true
      id_patterns: ["id", "user_id", "uid", "account_id", "order_id", "doc_id"]
    auth_bypass:
      enabled: true
      test_jwt: true
      test_session: true
      test_rbac: true
    injection:
      enabled: true
      sqli: true
      xss: true
      ssti: true
      ssrf: true
    graphql:
      enabled: true
      introspection: true
      batch_abuse: true
      alias_abuse: true
    cors:
      enabled: true
    race_condition:
      enabled: true
      concurrent_requests: 10
    mass_assignment:
      enabled: true
    business_logic:
      enabled: true

# Validation & FP Reduction
validation:
  pipeline:
    - "pattern_match"
    - "behavior_match"
    - "reproduction"
    - "proof_validation"
    - "ai_validation"
  confidence_threshold: 0.6  # Minimum to include in report
  max_reproduction_attempts: 3
  proof_based: true

# LLM / AI Settings
llm:
  provider: "ollama"  # ollama | openai | gemini
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:7b-instruct"
    timeout_seconds: 120
  openai:
    api_key: ""  # Set via env: PENFLOW_OPENAI_KEY
    model: "gpt-4o-mini"
  gemini:
    api_key: ""  # Set via env: PENFLOW_GEMINI_KEY
    model: "gemini-2.0-flash"
  fallback_chain: ["ollama", "openai", "gemini"]
  cache_responses: true
  max_tokens: 2048
  temperature: 0.1  # Low for deterministic output
  strict_json: true

# Reporting
reporting:
  language: "en"
  format: ["markdown", "html", "pdf"]
  template_dir: "web/templates/reports"
  include_raw_requests: true
  include_poc: true
  include_remediation: true
  include_cvss: true
  include_cwe: true
  group_by: "severity"  # severity | type | endpoint
  severity_calculator:
    use_cvss_v31: true
    business_impact_multiplier: 1.0
  llm_enrichment:
    enabled: true
    enrich_description: true
    enrich_impact: true
    enrich_remediation: true

# Continuous Monitoring
monitoring:
  enabled: false
  interval_hours: 24
  notify_on_change: true
  delta_scan: true
  track_new_subdomains: true
  track_new_endpoints: true
  track_tech_changes: true

# Web UI
web:
  host: "127.0.0.1"
  port: 5000
  debug: false
  secret_key: ""  # Auto-generated if empty
  sse_enabled: true
