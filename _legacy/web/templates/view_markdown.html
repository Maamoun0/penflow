{% extends "base.html" %}

{% block content %}
<div style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
    <div>
        <a href="/reports" style="color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600;">&larr; Back to Reports</a>
        <h2 style="margin: 0.5rem 0 0; font-size: 1.8rem; font-weight: bold;">Report for {{ target }}</h2>
    </div>
    <div>
        <a href="/reports/download/{{ target }}/{{ filename }}" class="btn">Download Raw Markdown</a>
    </div>
</div>

<div class="card" style="background: #111827; border: 1px solid #374151; padding: 2.5rem; line-height: 1.6; border-radius: 12px;">
    <div class="markdown-body">
        {{ html_body | safe }}
    </div>
</div>

<style>
    .markdown-body h1 {
        font-size: 2.2rem;
        color: var(--primary);
        border-bottom: 2px solid #374151;
        padding-bottom: 0.75rem;
        margin-top: 0;
        margin-bottom: 1.5rem;
    }
    .markdown-body h2 {
        font-size: 1.6rem;
        color: #f3f4f6;
        border-bottom: 1px solid #374151;
        padding-bottom: 0.5rem;
        margin-top: 2rem;
        margin-bottom: 1rem;
    }
    .markdown-body h3 {
        font-size: 1.3rem;
        color: #e5e7eb;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
    }
    .markdown-body h4 {
        font-size: 1.1rem;
        color: var(--primary);
        margin-top: 1rem;
        margin-bottom: 0.5rem;
    }
    .markdown-body p, .markdown-body li {
        color: #cbd5e1;
    }
    .markdown-body ul {
        padding-left: 1.5rem;
        margin-bottom: 1rem;
    }
    .markdown-body code {
        background: #1f2937;
        color: #f3f4f6;
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9em;
    }
    .markdown-body pre {
        background: #030712;
        border: 1px solid #374151;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
        margin: 1rem 0;
    }
    .markdown-body pre code {
        background: none;
        padding: 0;
        color: #38bdf8;
        font-size: 0.9rem;
    }
    .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
    }
    .markdown-body th, .markdown-body td {
        padding: 0.75rem;
        border: 1px solid #374151;
        text-align: left;
    }
    .markdown-body th {
        background: #1f2937;
        color: #f3f4f6;
    }
    .markdown-body blockquote {
        border-left: 4px solid var(--primary);
        margin: 1.5rem 0;
        padding-left: 1rem;
        color: #9ca3af;
        font-style: italic;
    }
    .severity-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        margin-left: 0.5rem;
    }
    .badge-critical { background-color: rgba(139, 92, 246, 0.2); color: #8b5cf6; border: 1px solid #8b5cf6; }
    .badge-high { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .badge-medium { background-color: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
    .badge-low { background-color: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; }
    .badge-info { background-color: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
</style>

<script>
    // Apply badge styles to strong elements that mention severity level
    document.querySelectorAll('.markdown-body strong').forEach(el => {
        const text = el.textContent.trim().toLowerCase();
        if (['critical', 'high', 'medium', 'low', 'info'].includes(text)) {
            el.className = 'severity-badge badge-' + text;
        }
    });
</script>
{% endblock %}
