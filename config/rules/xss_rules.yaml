rules:
  # ─── Stored XSS Rules ───────────────────────────────────────────────────────
  - rule_id: "R_XSS_COMMENT_01"
    condition_type: "observation_contains"
    match_value: "/post/comment"
    generated_title: "Stored XSS via Post Comment Form"
    generated_reason: "PortSwigger-style blog comment endpoint found — primary stored XSS attack surface"
    required_capabilities:
      - "reflected_xss"
      - "stored_xss"

  - rule_id: "R_XSS_COMMENT_02"
