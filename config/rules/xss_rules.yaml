    match_value: "/comment"
    generated_title: "Stored XSS via Comment Endpoint"
    generated_reason: "Comment submission endpoint discovered — high-value XSS target"
    required_capabilities:
      - "reflected_xss"
      - "stored_xss"

  - rule_id: "R_XSS_SEARCH_01"
